- id: '1787566919858'
  alias: Cave à vin - gestion optimisée
  description: Gestion de la température en privilégiant le refroidissement solaire
  triggers:
  - trigger: numeric_state
    entity_id: sensor.zg_227z_20_temperature
    above: 20
    for:
      minutes: 5
    id: trop_chaud
  - trigger: numeric_state
    entity_id: sensor.zg_227z_20_temperature
    above: 18
    for:
      minutes: 5
    id: solaire
  - trigger: numeric_state
    entity_id: sensor.zg_227z_20_temperature
    above: 19
    for:
      minutes: 5
    id: normal
  - trigger: numeric_state
    entity_id:
    - sensor.zg_227z_20_temperature
    below: 17
    for:
      minutes: 5
    id: froid
  - trigger: state
    entity_id: binary_sensor.production_panneaux_solaire
    to: 'on'
    id: solaire_on
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: trop_chaud
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.sb19_sb19_cave_a_vin
    - conditions:
      - condition: trigger
        id: froid
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.sb19_sb19_cave_a_vin
    - conditions:
      - condition: trigger
        id: solaire
      - condition: state
        entity_id: binary_sensor.production_panneaux_solaire
        state: 'on'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.sb19_sb19_cave_a_vin
    - conditions:
      - condition: trigger
        id: normal
      - condition: state
        entity_id: binary_sensor.production_panneaux_solaire
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.sb19_sb19_cave_a_vin
    - conditions:
      - condition: trigger
        id: solaire_on
      - condition: numeric_state
        entity_id: sensor.zg_227z_20_temperature
        above: 16
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.sb19_sb19_cave_a_vin
  mode: single
