type: sections
title: Appareils oubliés
path: appareils-oublies
icon: mdi:alert-remove
max_columns: 1
sections:
  - type: grid
    cards:
      - type: custom:button-card
        template: section_title
        name: 📜 Résumé
        grid_options:
          columns: full
      - type: custom:mushroom-template-card
        primary: |
          {% set appareils = [
            states('sensor.s1pm42_power'),
            states('sensor.sp1pm62_power'),
            states('sensor.s1pm40_power'),
            states('sensor.sp1pm63_power'),
            states('sensor.sp1pm61_power'),
          ] %} {% set actifs = appareils
            | select('is_number')
            | map('float')
            | select('gt', 8)
            | list
            | count %}
          {% if actifs == 0 %}
            🟢 Rien d'anormal
          {% else %}
            🟠 {{ actifs }} appareil(s) actif(s)
          {% endif %}
        secondary: |
          Surveillance des appareils à consommation variable
        icon: |
          {% if
            states('sensor.s1pm42_power')|float(0) > 5 or
            states('sensor.sp1pm62_power')|float(0) > 5 or
            states('sensor.s1pm40_power')|float(0) > 5 or
            states('sensor.sp1pm63_power')|float(0) > 8 or
            states('sensor.sp1pm61_power')|float(0) > 5 
          %}
            mdi:alert-circle
          {% else %}
            mdi:shield-check
          {% endif %}
        grid_options:
          columns: full
        color: |
          {% if
            states('sensor.s1pm42_power')|float(0) > 5 or
            states('sensor.sp1pm62_power')|float(0) > 5 or
            states('sensor.s1pm40_power')|float(0) > 5 or
            states('sensor.sp1pm63_power')|float(0) > 8 or
            states('sensor.sp1pm61_power')|float(0) > 5 
          %}
            orange
          {% else %}
            green
          {% endif %}
        features_position: bottom
        tap_action:
          action: navigate
          navigation_path: /la-maison-des-dous/appareils-oublies
  - type: grid
    cards:
      - type: custom:button-card
        template: section_title
        name: 📟 Appareils
        grid_options:
          columns: full
      - type: custom:mushroom-template-card
        primary: |
          {% if states('sensor.s1pm42_power')|float(0) > 5 %}
            🧽 Eponge active
          {% else %}
            🧽 Eponge éteinte
          {% endif %}
        icon: |
          {% if
            states('sensor.s1pm42_power')|float(0) > 5
          %}
            mdi:alert-circle
          {% else %}
            mdi:shield-check
          {% endif %}
        features_position: bottom
        color: |
          {% if
            states('sensor.s1pm42_power')|float(0) > 5
          %}
            orange
          {% else %}
            green
          {% endif %}
      - type: custom:mushroom-template-card
        primary: |
          {% if states('sensor.sp1pm62_power')|float(0) > 5 %}
            🍽️ Lavette active
          {% else %}
            🍽️ Lavette éteinte
          {% endif %}
        icon: |
          {% if
            states('sensor.sp1pm62_power')|float(0) > 5
          %}
            mdi:alert-circle
          {% else %}
            mdi:shield-check
          {% endif %}
        features_position: bottom
        color: |
          {% if
            states('sensor.sp1pm62_power')|float(0) > 5
          %}
            orange
          {% else %}
            green
          {% endif %}
      - type: custom:mushroom-template-card
        primary: |
          {% if states('sensor.s1pm40_power')|float(0) > 5 %}
            💨 Compresseur actif
          {% else %}
            💨 Compresseur éteint
          {% endif %}
        icon: |
          {% if
            states('sensor.s1pm40_power')|float(0) > 5
          %}
            mdi:alert-circle
          {% else %}
            mdi:shield-check
          {% endif %}
        features_position: bottom
        color: |
          {% if
            states('sensor.s1pm40_power')|float(0) > 5
          %}
            orange
          {% else %}
            green
          {% endif %}
      - type: custom:mushroom-template-card
        primary: |
          {% if states('sensor.sp1pm63_power')|float(0) > 8 %}
            🖥️ Bureau FV actif
          {% else %}
            🖥️ Bureau FV éteint
          {% endif %}
        icon: |
          {% if
            states('sensor.sp1pm63_power')|float(0) > 8
          %}
            mdi:alert-circle
          {% else %}
            mdi:shield-check
          {% endif %}
        features_position: bottom
        color: |
          {% if
            states('sensor.sp1pm63_power')|float(0) > 8
          %}
            orange
          {% else %}
            green
          {% endif %}
      - type: custom:mushroom-template-card
        primary: |
          {% if states('sensor.sp1pm61_power')|float(0) > 5 %}
            🚜 Wall-e actif
          {% else %}
            🚜 Wall-e éteint
          {% endif %}
        icon: |
          {% if
            states('sensor.sp1pm61_power')|float(0) > 5
          %}
            mdi:alert-circle
          {% else %}
            mdi:shield-check
          {% endif %}
        features_position: bottom
        color: |
          {% if
            states('sensor.sp1pm61_power')|float(0) > 5
          %}
            orange
          {% else %}
            green
          {% endif %}
  - type: grid
    cards:
      - type: custom:button-card
        template: section_title
        name: ♾️ Appareils à cycles
        grid_options:
          columns: full
      - type: custom:mushroom-template-card
        primary: Éponge
        secondary: |
          {{ states('sensor.s1pm42_power') }} W
        icon: mdi:power-cycle
        icon_color: |
          {% if states('sensor.s1pm42_power')|float(0) > 5 %}
            orange
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
          entity: sensor.s1pm42_power
      - type: custom:mushroom-template-card
        primary: Lavette
        secondary: |
          {{ states('sensor.sp1pm62_power') }} W
        icon: mdi:washing-machine
        icon_color: |
          {% if states('sensor.sp1pm62_power')|float(0) > 5 %}
            orange
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
          entity: sensor.sp1pm62_power
      - type: entities
        title: État Lavette
        show_header_toggle: false
        entities:
          - entity: sensor.lavette_operation_state
            name: État
          - entity: sensor.lavette_program_progress
            name: Progression
          - entity: sensor.lavette_program_finish_time
            name: Fin prévue
  - type: grid
    cards:
      - type: custom:button-card
        template: section_title
        name: ⚙️ Outils
        grid_options:
          columns: full
      - type: custom:mushroom-template-card
        primary: Compresseur
        secondary: |
          {{ states('sensor.s1pm40_power') }} W
        icon: mdi:air-compressor
        icon_color: |
          {% if states('sensor.s1pm40_power')|float(0) > 5 %}
            orange
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
          entity: sensor.s1pm40_power
      - type: custom:mushroom-template-card
        primary: Déshumidifacteur
        secondary: |
          {{ states('sensor.s1pm59_power') }} W
        icon: mdi:power-cycle
        color: |
          {% if states('sensor.s1pm59_power')|float(0) > 5 %}
            orange
          {% else %}
            grey
          {% endif %}
        features_position: bottom
  - type: grid
    cards:
      - type: custom:button-card
        template: section_title
        name: 💻 Informatique
        grid_options:
          columns: full
      - type: custom:mushroom-template-card
        primary: PC Game
        secondary: |
          {{ states('sensor.sm25_power') }} W
        icon: mdi:desktop-classic
        icon_color: |
          {% if states('sensor.sm25_power')|float(0) > 10 %}
            green
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
          entity: switch.sm25
      - type: custom:mushroom-template-card
        primary: Bureau / écrans
        secondary: |
          {{ states('sensor.sm26_power') }} W
        icon: mdi:monitor-multiple
        icon_color: |
          {% if states('sensor.sm26_power')|float(0) > 10 %}
            amber
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
          entity: switch.sm26
      - type: custom:mushroom-template-card
        primary: Prise bureau
        secondary: |
          {{ states('sensor.sp1pm63_power') }} W
        icon: mdi:power-socket-fr
        icon_color: |
          {% if states('sensor.sp1pm63_power')|float(0) > 10 %}
            orange
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: more-info
          entity: switch.sp1pm63
      - type: custom:mushroom-template-card
        primary: Serveurs
        secondary: |
          {{ states('sensor.s1pm30_power') }} W
        icon: mdi:server
        icon_color: green
        tap_action:
          action: more-info
          entity: switch.s1pm30
  - type: grid
    cards:
      - type: custom:button-card
        template: section_title
        name: 🔌 Appareils permanents
        grid_options:
          columns: full
      - type: entities
        title: Consommations actuelles
        show_header_toggle: false
        state_color: true
        entities:
          - entity: sensor.s1pm30_power
            name: 🖥️ Serveurs
          - entity: sensor.sp1pm64_power
            name: 🍷 Cave
          - entity: sensor.s1pm59_power
            name: 💧 Déshumidificateur
          - entity: sensor.s1pm43_power
            name: 🔥 Chauffage
          - entity: sensor.s1pm44_power
            name: 🚿 Boiler
          - entity: sensor.s1pm60_power
            name: 💦 Culligan
  - type: grid
    cards:
      - type: custom:button-card
        template: section_title
        name: 📊 Historique
        grid_options:
          columns: full
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Appareils à surveiller — 24h
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 220
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: true
            position: bottom
            fontSize: 10px
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                fontSize: 10px
        yaxis:
          - decimals: 0
            apex_config:
              tickAmount: 4
        series:
          - entity: sensor.s1pm42_power
            name: Eponge · moy
            color: var(--info-color)
            type: line
            stroke_width: 2
            statistics:
              type: mean
              period: 5minute
              align: middle
          - entity: sensor.s1pm42_power
            name: Eponge · max
            color: var(--warning-color)
            type: line
            stroke_width: 2
            statistics:
              type: max
              period: 5minute
              align: middle
          - entity: sensor.sp1pm62_power
            name: Lavette · moy
            color: var(--success-color)
            type: line
            stroke_width: 2
            statistics:
              type: mean
              period: 5minute
              align: middle
          - entity: sensor.sp1pm62_power
            name: Lavette · max
            color: var(--purple-color)
            type: line
            stroke_width: 2
            statistics:
              type: max
              period: 5minute
              align: middle
          - entity: sensor.s1pm40_power
            name: Compresseur · moy
            color: var(--error-color)
            type: line
            stroke_width: 2
            statistics:
              type: mean
              period: 5minute
              align: middle
          - entity: sensor.s1pm40_power
            name: Compresseur · max
            color: var(--cyan-color)
            type: line
            stroke_width: 2
            statistics:
              type: max
              period: 5minute
              align: middle
          - entity: sensor.sp1pm63_power
            name: Bureau FV · moy
            color: var(--orange-color)
            type: line
            stroke_width: 2
            statistics:
              type: mean
              period: 5minute
              align: middle
          - entity: sensor.sp1pm63_power
            name: Bureau FV · max
            color: var(--info-color)
            type: line
            stroke_width: 2
            statistics:
              type: max
              period: 5minute
              align: middle
          - entity: sensor.sp1pm61_power
            name: Wall-e · moy
            color: var(--warning-color)
            type: line
            stroke_width: 2
            statistics:
              type: mean
              period: 5minute
              align: middle
          - entity: sensor.sp1pm61_power
            name: Wall-e · max
            color: var(--success-color)
            type: line
            stroke_width: 2
            statistics:
              type: max
              period: 5minute
              align: middle
      - type: custom:apexcharts-card
        graph_span: 7d
        update_interval: 30min
        header:
          show: true
          title: Appareils à surveiller — 7 jours
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 220
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: true
            position: bottom
            fontSize: 10px
          xaxis:
            labels:
              datetimeUTC: false
              format: dd/MM
              style:
                fontSize: 10px
        yaxis:
          - decimals: 0
            apex_config:
              tickAmount: 4
        series:
          - entity: sensor.s1pm42_power
            name: Eponge
            color: var(--info-color)
            type: line
            stroke_width: 2
            statistics:
              type: mean
              period: hour
              align: middle
          - entity: sensor.sp1pm62_power
            name: Lavette
            color: var(--warning-color)
            type: line
            stroke_width: 2
            statistics:
              type: mean
              period: hour
              align: middle
          - entity: sensor.s1pm40_power
            name: Compresseur
            color: var(--success-color)
            type: line
            stroke_width: 2
            statistics:
              type: mean
              period: hour
              align: middle
          - entity: sensor.sp1pm63_power
            name: Bureau FV
            color: var(--purple-color)
            type: line
            stroke_width: 2
            statistics:
              type: mean
              period: hour
              align: middle
          - entity: sensor.sp1pm61_power
            name: Wall-e
            color: var(--error-color)
            type: line
            stroke_width: 2
            statistics:
              type: mean
              period: hour
              align: middle
cards: []
header:
  card:
    type: markdown
    text_only: true
    content: '# 🔍 Surveillance'
